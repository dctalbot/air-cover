openapi: 3.0.3
info:
  title: Air Cover API
  description: API for Air Cover session management and show tracking.
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /auth/login:
    post:
      summary: Request a magic link for login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request
  /auth/verify:
    get:
      summary: Verify magic link and create session
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to home or app
        '401':
          description: Invalid or expired token
  /auth/logout:
    post:
      summary: Logout and invalidate sessions
      responses:
        '302':
          description: Redirect to home
        '401':
          description: Unauthorized
  /:
    get:
      summary: Home page or login page
      responses:
        '200':
          description: HTML content
          content:
            text/html:
              schema:
                type: string
  /app:
    get:
      summary: Authenticated application page
      responses:
        '200':
          description: HTML content
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized
  /admin:
    get:
      summary: Admin dashboard
      responses:
        '200':
          description: HTML content
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /sub-requests:
    post:
      summary: Create a new sub request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                show:
                  type: integer
                start_time:
                  type: string
                end_time:
                  type: string
                notes:
                  type: string
              required:
                - show
                - start_time
                - end_time
  /sub-requests/{id}:
    delete:
      summary: Delete a sub request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Sub request deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not the creator)
        '404':
          description: Not found
    patch:
      summary: Take or untake a sub request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [take, untake]
              required:
                - action
      responses:
        '204':
          description: Sub request updated
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Conflict (already taken)
  /users:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [member, admin]
              required:
                - email
      responses:
        '302':
          description: Redirect back to admin dashboard
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /users/import/spinitron:
    post:
      summary: Import users from Spinitron
      responses:
        '302':
          description: Redirect back to admin dashboard
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error


  /users/{id}:
    patch:
      summary: Update a user's status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled:
                  type: boolean
                role:
                  type: string
                  enum: [member, admin]
      responses:
        '204':
          description: User updated
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    MessageResponse:
      type: object
      properties:
        message:
          type: string
