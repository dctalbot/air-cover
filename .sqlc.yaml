version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/adapters/outbound/sqlite/schema.sql"
    queries: "internal/adapters/outbound/sqlite/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/adapters/outbound/sqlite/dbgen"
        emit_json_tags: true
        output_files_suffix: ".gen"
        output_batch_file_name: "batch.gen.go"
        output_db_file_name: "db.gen.go"
        output_models_file_name: "models.gen.go"
        output_querier_file_name: "querier.gen.go"
        output_copyfrom_file_name: "copyfrom.gen.go"
