<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Cover</title>
  </head>
  <body>
    <h1>Welcome to Air Cover</h1>
    <form action="/sub-request" method="POST">
      <label for="show-select">Shows</label>
      <select id="show-select" name="show" required>
        {{if not .Shows}}
        <option value="">No shows available</option>
        {{else}}
        <option value="">Select a show</option>
        {{range .Shows}}
        <option value="{{.ID}}">
          {{if .Title}}{{.Title}}{{else}}{{.ID}}{{end}}
        </option>
        {{end}} {{end}}
      </select>
      <br />
      <label for="start-time">Start Time</label>
      <input type="datetime-local" id="start-time" name="start_time" required />
      <br />
      <label for="end-time">End Time</label>
      <input type="datetime-local" id="end-time" name="end_time" required />
      <br />
      <label for="blockquote-preview">Preview</label>
      <blockquote id="blockquote-preview">
        <p>
          <b>{{.Email}}</b> is requesting a sub<span id="selected-show"></span>
          for a duration of:
          <span id="total-duration">0</span>
        </p>
      </blockquote>
      <label for="notes">Other info (barter, etc)</label>
      <br />
      <textarea
        id="notes"
        name="notes"
        rows="4"
        cols="80"
        placeholder="I can offer baked cookies, beer, or some new music recs :)"
      ></textarea>
      <br />
      <button type="submit">Submit Request</button>
    </form>

    <script>
      const showSelect = document.getElementById("show-select");
      const selectedShowSpan = document.getElementById("selected-show");
      const startTimeInput = document.getElementById("start-time");
      const endTimeInput = document.getElementById("end-time");
      const totalDurationDisplay = document.getElementById("total-duration");

      showSelect.addEventListener("change", () => {
        const selectedOption = showSelect.options[showSelect.selectedIndex];
        if (selectedOption.value) {
          selectedShowSpan.innerHTML = ` for <i>${selectedOption.textContent.trim()}</i>`;
        } else {
          selectedShowSpan.innerHTML = "";
        }
      });

      // Set min for start-time to 24 hours ago (ignoring seconds)
      const now = new Date();
      const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000);
      const pad = (num) => String(num).padStart(2, "0");
      const minStartStr = `${yesterday.getFullYear()}-${pad(
        yesterday.getMonth() + 1,
      )}-${pad(yesterday.getDate())}T${pad(yesterday.getHours())}:${pad(
        yesterday.getMinutes(),
      )}`;
      startTimeInput.min = minStartStr;

      function updateTotalDuration() {
        const start = new Date(startTimeInput.value);
        const end = new Date(endTimeInput.value);

        if (isNaN(start) || isNaN(end)) {
          totalDurationDisplay.textContent = "0";
          return;
        }

        const diff = end - start;
        if (diff < 0) {
          totalDurationDisplay.textContent = "0 (End time before start time)";
          return;
        }

        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const hours = Math.floor(diff / (1000 * 60 * 60));

        totalDurationDisplay.textContent = `${hours}h ${minutes}m`;
      }

      startTimeInput.addEventListener("input", () => {
        endTimeInput.min = startTimeInput.value;
        updateTotalDuration();
      });
      endTimeInput.addEventListener("input", updateTotalDuration);
    </script>
  </body>
</html>
