<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Cover</title>
  </head>
  <body>
    <h1>Welcome to Air Cover</h1>
    <p>Select a show to continue.</p>
    <label for="show-select">Shows</label>
    <select id="show-select" name="show">
      {{if not .}}
        <option value="">No shows available</option>
      {{else}}
        <option value="">Select a show</option>
        {{range .}}
          <option value="{{.ID}}">{{if .Title}}{{.Title}}{{else}}{{.ID}}{{end}}</option>
        {{end}}
      {{end}}
    </select>
  </body>
</html>
