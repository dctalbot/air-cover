<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Air Cover</title>
  </head>
  <body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>Admin Dashboard</h1>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="/app">Back to App</a>
        <form action="/auth/logout" method="POST" style="margin: 0;">
          <button type="submit">Log Out</button>
        </form>
      </div>
    </div>

    <hr />
    <section style="margin-bottom: 2rem; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 1.5rem;">
      <h2 style="margin-top: 0;">Create New User</h2>
      <form action="/users" method="POST" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 200px;">
          <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="dj@example.com" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
        </div>
        <div>
          <label for="role" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Role</label>
          <select id="role" name="role" required style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; background: white;">
            <option value="member">Member</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" style="background-color: #0369a1; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 500; height: 38px;">Create User</button>
      </form>
    </section>

    <h2>Users</h2>
    <div id="users-list">
      {{if not .Users}}
      <p>No users found.</p>
      {{else}} {{range .Users}}
      <div class="user-card" id="user-card-{{.ID}}">
        <div class="user-info">
          <h3>{{.Email}}</h3>
          <p>
            <strong>Role:</strong> <span class="role-badge role-{{.Role}}">{{.Role}}</span><br />
            <strong>Added:</strong> {{.CreatedAt}}
          </p>
        </div>
        <div class="user-actions">
          {{if .CanDelete}}
          <button class="delete-button" onclick="deleteUser({{.ID}})">Delete</button>
          {{end}}
        </div>
      </div>
      {{end}} {{end}}
    </div>

    <script>
      async function deleteUser(userId) {
        if (!confirm('Are you sure you want to delete this user? This will also delete all their sessions and sub-requests.')) {
          return;
        }

        try {
          const response = await fetch(`/users/${userId}`, {
            method: 'DELETE',
          });

          if (response.ok) {
            const card = document.getElementById(`user-card-${userId}`);
            if (card) {
              card.remove();
            }
          } else {
            const error = await response.text();
            alert(`Failed to delete user: ${error}`);
          }
        } catch (err) {
          console.error('Delete failed:', err);
          alert('Failed to delete user due to a network error.');
        }
      }
    </script>

    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
      }
      .user-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        background: #f9f9f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .user-info h3 {
        margin: 0 0 0.5rem 0;
      }
      .user-info p {
        margin: 0;
        color: #666;
      }
      .role-badge {
        display: inline-block;
        padding: 0.125rem 0.5rem;
        border-radius: 4px;
        font-size: 0.875rem;
        font-weight: 500;
        text-transform: uppercase;
      }
      .role-admin {
        background-color: #e3f2fd;
        color: #1565c0;
      }
      .role-user {
        background-color: #f5f5f5;
        color: #616161;
      }
      .delete-button {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .delete-button:hover {
        background-color: #fecaca;
      }
    </style>
  </body>
</html>
