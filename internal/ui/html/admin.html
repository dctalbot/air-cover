<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Air Cover</title>
  </head>
  <body>
    <div
      style="display: flex; justify-content: space-between; align-items: center"
    >
      <h1>Admin Dashboard</h1>
      <div style="display: flex; align-items: center; gap: 1rem">
        <a href="/app">Back to App</a>
        <div
          style="display: flex; flex-direction: column; align-items: flex-end"
        >
          <span style="font-size: 0.8rem; color: #666">{{.Email}}</span>
          <form action="/auth/logout" method="POST" style="margin: 0">
            <button type="submit">Log Out</button>
          </form>
        </div>
      </div>
    </div>

    <hr />
    <section
      style="
        margin-bottom: 2rem;
        background: #f0f9ff;
        border: 1px solid #bae6fd;
        border-radius: 8px;
        padding: 0.5rem;
      "
    >
      <h2 style="margin-top: 0">Add a User</h2>
      <form
        action="/users"
        method="POST"
        style="display: flex; gap: 20px; flex-direction: column"
      >
        <div style="flex: 1; min-width: 200px">
          <label
            for="email"
            style="display: block; margin-bottom: 0.5rem; font-weight: 500"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="dj@example.com"
            style="
              width: 100%;
              padding: 0.5rem;
              border: 1px solid #ccc;
              box-sizing: border-box;
            "
          />
        </div>
        <div>
          <label
            for="role"
            style="display: block; margin-bottom: 0.5rem; font-weight: 500"
            >Role</label
          >
          <select
            id="role"
            name="role"
            required
            style="
              padding: 0.5rem;
              border: 1px solid #ccc;
              border-radius: 4px;
              background: white;
            "
          >
            <option value="member">Member</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>

    <h2>Users</h2>
    <div id="users-list">
      {{if not .Users}}
      <p>No users found.</p>
      {{else}} {{range .Users}}
      <div class="user-card" id="user-card-{{.ID}}">
        <div class="user-info">
          <h3>{{.Email}}</h3>
          <p>
            <strong>Role:</strong>
            <span class="role-badge role-{{.Role}}">{{.Role}}</span><br />
            <strong>Added:</strong> {{.CreatedAt}}
          </p>
        </div>
        <div class="user-actions">
          {{if .CanDeactivate}}
          <button
            class="{{if .IsEnabled}}deactivate-button{{else}}activate-button{{end}}"
            onclick="toggleUserStatus({{.ID}}, {{.IsEnabled}})"
          >
            {{if .IsEnabled}}Deactivate{{else}}Activate{{end}}
          </button>
          {{if .IsEnabled}}
          <button
            class="role-button"
            onclick="toggleUserRole({{.ID}}, '{{.Role}}')"
          >
            {{if eq .Role "admin"}}Demote to Member{{else}}Promote to
            Admin{{end}}
          </button>
          {{end}} {{end}}
        </div>
      </div>
      {{end}} {{end}}
    </div>

    <script>
      async function toggleUserStatus(userId, currentIsEnabled) {
        const newStatus = !currentIsEnabled;
        const action = newStatus ? "activate" : "deactivate";
        if (!confirm(`Are you sure you want to ${action} this user?`)) {
          return;
        }

        try {
          const response = await fetch(`/users/${userId}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ is_enabled: newStatus }),
          });

          if (response.ok) {
            window.location.reload();
          } else {
            const error = await response.text();
            alert(`Failed to ${action} user: ${error}`);
          }
        } catch (err) {
          console.error("Update failed:", err);
          alert(`Failed to ${action} user due to a network error.`);
        }
      }

      async function toggleUserRole(userId, currentRole) {
        const newRole = currentRole === "admin" ? "member" : "admin";
        const action = newRole === "admin" ? "promote" : "demote";
        if (
          !confirm(
            `Are you sure you want to ${action} this user to ${newRole}?`,
          )
        ) {
          return;
        }

        try {
          const response = await fetch(`/users/${userId}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ role: newRole }),
          });

          if (response.ok) {
            window.location.reload();
          } else {
            const error = await response.text();
            alert(`Failed to ${action} user: ${error}`);
          }
        } catch (err) {
          console.error("Update failed:", err);
          alert(`Failed to ${action} user due to a network error.`);
        }
      }
    </script>

    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.5;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
      }
      .user-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        background: #f9f9f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .user-info h3 {
        margin: 0 0 0.5rem 0;
      }
      .user-info p {
        margin: 0;
        color: #666;
      }
      .role-badge {
        display: inline-block;
        padding: 0.125rem 0.5rem;
        border-radius: 4px;
        font-size: 0.875rem;
        font-weight: 500;
        text-transform: uppercase;
      }
      .role-admin {
        background-color: #e3f2fd;
        color: #1565c0;
      }
      .role-user {
        background-color: #f5f5f5;
        color: #616161;
      }
      .deactivate-button {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .deactivate-button:hover {
        background-color: #fecaca;
      }
      .activate-button {
        background-color: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .activate-button:hover {
        background: #dcfce7;
      }
      .role-button {
        background: #6366f1;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
      }
      .role-button:hover {
        background: #4f46e5;
      }
    </style>
  </body>
</html>
