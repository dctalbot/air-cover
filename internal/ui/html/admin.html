<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Air Cover</title>
  </head>
  <body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>Admin Dashboard</h1>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="/app">Back to App</a>
        <form action="/auth/logout" method="POST" style="margin: 0;">
          <button type="submit">Log Out</button>
        </form>
      </div>
    </div>

    <hr />

    <h2>Users</h2>
    <div id="users-list">
      {{if not .Users}}
      <p>No users found.</p>
      {{else}} {{range .Users}}
      <div class="user-card">
        <div class="user-info">
          <h3>{{.Email}}</h3>
          <p>
            <strong>Role:</strong> <span class="role-badge role-{{.Role}}">{{.Role}}</span><br />
            <strong>Added:</strong> {{.CreatedAt}}
          </p>
        </div>
      </div>
      {{end}} {{end}}
    </div>

    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
      }
      .user-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        background: #f9f9f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .user-info h3 {
        margin: 0 0 0.5rem 0;
      }
      .user-info p {
        margin: 0;
        color: #666;
      }
      .role-badge {
        display: inline-block;
        padding: 0.125rem 0.5rem;
        border-radius: 4px;
        font-size: 0.875rem;
        font-weight: 500;
        text-transform: uppercase;
      }
      .role-admin {
        background-color: #e3f2fd;
        color: #1565c0;
      }
      .role-user {
        background-color: #f5f5f5;
        color: #616161;
      }
    </style>
  </body>
</html>
