<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Cover Login</title>
  </head>
  <body>
    <h1>Air Cover</h1>
    <p>Enter your account email address to receive a login link.</p>
    {{if .Submitted}}
    <p id="message" role="status">
      <strong>If an account exists, an email has been sent.</strong>
    </p>
    {{end}}
    <form id="magic-link-form" action="/auth/login" method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
