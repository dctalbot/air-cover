root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  entrypoint = ["./tmp/main", "server"]
  pre_cmd = ["make generate"]
  cmd = "go build -o ./tmp/main ./cmd/aircover/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git", ".github"]
  exclude_file = []
  exclude_regex = ["_test.go", "_templ.go$", "\\.gen\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "templ", "html", "css", "js", "yaml"]
  include_file = []
  kill_delay = "10s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
